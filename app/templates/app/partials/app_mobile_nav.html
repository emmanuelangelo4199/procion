{% with current=request.resolver_match.url_name %}
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe bg-sanctuary-white/90 backdrop-blur-md border-t border-soft-sage z-50">
    <a class="flex flex-col items-center justify-center rounded-xl px-4 py-1 {% if current == 'dashboard' %}bg-seafoam-mist/40 text-deep-forest{% else %}text-earth-gray{% endif %}" href="{% url 'dashboard' %}">
        <span class="material-symbols-outlined" data-icon="home" {% if current == 'dashboard' %}style="font-variation-settings: 'FILL' 1;"{% endif %}>home</span>
        <span class="font-caption text-caption">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center {% if current == 'journal' %}bg-seafoam-mist/40 text-deep-forest rounded-xl px-4 py-1{% else %}text-earth-gray{% endif %}" href="{% url 'journal' %}">
        <span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
        <span class="font-caption text-caption">Log</span>
    </a>
    <a class="flex flex-col items-center justify-center {% if current == 'insights' %}bg-seafoam-mist/40 text-deep-forest rounded-xl px-4 py-1{% else %}text-earth-gray{% endif %}" href="{% url 'insights' %}">
        <span class="material-symbols-outlined" data-icon="analytics">analytics</span>
        <span class="font-caption text-caption">Insights</span>
    </a>
    <a class="flex flex-col items-center justify-center {% if current == 'circle' %}bg-seafoam-mist/40 text-deep-forest rounded-xl px-4 py-1{% else %}text-earth-gray{% endif %}" href="{% url 'circle' %}">
        <span class="material-symbols-outlined" data-icon="group">group</span>
        <span class="font-caption text-caption">Circle</span>
    </a>
</nav>
{% endwith %}
